name: Deploy FabSoft Redes Sociales

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-redes-fabsoft
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger restricted deploy on VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}"

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://redes.fabsoft.app/health; then
              echo ""
              exit 0
            fi
            echo "Waiting for service ($i/6)..."
            sleep 5
          done
          exit 1
